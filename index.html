/* ===== ParkNova Pro Motion System ===== */

:root{

}

function mapsDestination(p){const label=(p.name||'').replace(/\s+Parking$/i,'').trim();return encodeURIComponent([label,p.area,'Rajkot','Gujarat','India'].filter(Boolean).join(', '))}
function navigateNearest(){const x=parking.find(p=>p.free>0)||parking[0];if(!x)return;if(localStorage.getItem('parknova_gps')==='off')return toast('Enable GPS in Settings first');window.open('https://www.google.com/maps/dir/?api=1&destination='+mapsDestination(x),'_blank')}
function render(){if(!me){login();return}let free=parking.reduce((s,x)=>s+x.free,0);$('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><div class="logo">P</div>ParkNova</div><div class="nav"><button class="active">⌂ Overview</button><button onclick="focusLots()">⌕ Find Parking</button><button onclick="loadBookings()">▣ My Bookings</button><button onclick="showHistory()">◷ History</button><button onclick="showSettings()">⚙ Settings</button>${me.role==='admin'?'<button onclick="admin()">▦ Admin Console</button>':''}</div><div style="margin-top:40px;padding:14px;border:1px solid var(--line);border-radius:15px"><b>${me.name}</b><div class="label">${me.role==='admin'?'Administrator':'Premium user'}</div></div></aside><main class="main"><div class="top"><div><div class="ey">Live parking network</div><div class="title">Good evening, ${me.name} 👋</div><div class="sub">Find a spot, reserve it, and park without the hassle.</div></div><button class="btn" onclick="logout()">Logout</button></div><div class="grid"><div><section class="card hero"><div class="ey">Smart parking</div><h2>Park smarter. Arrive stress-free.</h2><p class="sub">Real-time availability from the API.</p><div class="search"><input id="q" placeholder="Search parking location..." oninput="filter()"><button class="btn primary" onclick="focusLots()">Find a spot</button></div></section><div class="stats"><div class="stat"><div class="num">${free}</div><div class="label">Free slots</div></div><div class="stat"><div class="num">${parking.length}</div><div class="label">Locations</div></div><div class="stat"><div class="num">₹20<span class="label">/hr</span></div><div class="label">Starting price</div></div></div><section class="card" id="lots"><h3>Available parking</h3><div class="lots">${parking.map(lot).join('')}</div></section></div><div><section class="card"><h3>Live Free Map</h3><div class="map"><div id="map" class="mapcanvas"></div></div><div class="mapactions"><button class="btn primary" onclick="locateMe()">📍 My Location</button><button class="btn" onclick="navigateNearest()">🧭 Navigate</button><button class="btn" onclick="load()">↻ Refresh</button></div><div class="bookingbox" style="margin-top:10px"><b>📍 Rajkot · Free Map</b><div class="sub">Free browser map view + manual parking markers. Navigation opens Google Maps. No parking sensors are used.</div></div></section><section class="card"><h3>My vehicle & services</h3><div class="bookingbox"><b>🚗 ${localStorage.getItem('parknova_plate')||'GJ-03-AB-1234'}</b><div class="sub">White Sedan · Fastag linked</div></div></section></div></div></main></div>`}
function lot(x){let occupied=new Set(bookingRecords.filter(b=>b.location===x.name&&b.status!=='Cancelled'&&b.status!=='Completed').map(b=>Number(b.parkingNo)));let slots=Array.from({length:Math.min(x.total,12)},(_,i)=>`<span class="slot ${occupied.has(i+1)?'busy':'free'}">${i+1}</span>`).join('');return `<div class="lot"><div class="lotrow"><div><b>${x.name}</b><div class="label">${x.area} · ₹${x.price}/hr</div></div><span class="tag ${x.free?'free':'busy'}">${x.free?'Available':'Full'}</span></div><div class="slots">${slots}</div><button class="btn ${x.free?'primary':''}" style="width:100%" onclick="book(${x.id})">${x.free?'Reserve a slot':'Join waitlist'}</button></div>`}
function filter(){let q=$('q').value.toLowerCase();document.querySelector('.lots').innerHTML=parking.filter(x=>(x.name+' '+x.area).toLowerCase().includes(q)).map(lot).join('')}
function focusLots(){$('lots').scrollIntoView({behavior:'smooth'})}
async function book(id){let x=parking.find(p=>p.id===id);if(!x.free)return toast('Parking full');let today=new Date().toISOString().slice(0,10);document.body.insertAdjacentHTML('beforeend',`<div class="modal"><div class="box"><div class="ey">Secure reservation</div><h2>${x.name}</h2><div class="bookingbox" style="margin-bottom:12px"><b>🅿️ Parking number</b><div class="sub">The system will assign the first available slot number and keep that exact number for this booking.</div></div><div class="field"><label>DATE · FUTURE DATES ONLY</label><input id="bd" type="date" min="${today}" value="${today}"></div><div class="field"><label>TIME · EXACT TIME</label><div class="time-picker" aria-label="Booking time"><select id="bth" aria-label="Hour">${Array.from({length:12},(_,i)=>{let h=i+1;return `<option value="${h}" ${h===8?"selected":""}>${h}</option>`}).join("")}</select><span>:</span><select id="btm" aria-label="Minute">${Array.from({length:60},(_,i)=>{let m=String(i).padStart(2,"0");return `<option value="${m}" ${m==="37"?"selected":""}>${m}</option>`}).join("")}</select><select id="bta" aria-label="AM or PM"><option value="AM">AM</option><option value="PM" selected>PM</option></select></div><div class="sub" style="margin-top:6px">Select any exact minute, e.g. 8:37 AM or 8:37 PM.</div></div><div class="field"><label>BOOKING DURATION · 1–24 HOURS</label><select id="bu">${Array.from({length:24},(_,i)=>`<option value="${i+1}">${i+1} hour${i?'s':''}</option>`).join('')}</select></div><button class="btn primary" style="width:100%" onclick="confirmBook(${x.id})">Confirm & Pay →</button><button class="btn" style="width:100%;margin-top:8px" onclick="this.closest('.modal').remove()">Cancel</button></div></div>`)}
async function confirmBook(id){try{let h=+$('bth').value,m=+$('btm').value,ampm=$('bta').value;if(ampm==='AM'){if(h===12)h=0}else if(h!==12)h+=12;let bookingTime=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;let b=await api('/api/bookings',{method:'POST',body:JSON.stringify({parkingId:id,email:me.name==='Admin'?'admin@parknova.com':'demo@parknova.com',date:$('bd').value,time:bookingTime,duration:+$('bu').value,parkingNo:null})});let x=parking.find(p=>p.id===id);document.querySelector('.modal').remove();await load();document.body.insertAdjacentHTML('beforeend',`<div class="modal"><div class="box" style="text-align:center"><div class="ey">Booking Confirmed ✓</div><h2>${b.location}</h2><p class="sub">Booking ID: ${b.id}<br>🅿️ Parking No. ${b.parkingNo}<br>${b.date} · ${b.time} · ${b.duration} hour · ₹${b.total}</p><div class="bookingbox"><b>📍 Your booked parking</b><div class="sub">Navigation will open the exact booked parking location in Google Maps.</div></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="navigateBooking('${b.id}');this.closest('.modal').remove()">🧭 Navigate to ${b.location}</button><button class="btn" style="width:100%;margin-top:8px" onclick="this.closest('.modal').remove()">Close</button></div></div>`);toast(`Booking ${b.id} confirmed ✓`)}catch(e){toast('Booking failed: '+(e.message||'Please check date, time and slot'))}}
async function loadBookings(){try{let all=await api('/api/bookings'),b=all.filter(x=>!me||x.user===me.email);document.body.insertAdjacentHTML('beforeend',`<div class="modal"><div class="box" style="width:min(760px,calc(100% - 30px));max-height:86vh;overflow:auto"><div class="ey">ParkNova · ${me?.name||'User'}</div><h2>My Bookings</h2><p class="sub">Your reservations are shown here.</p>${b.length?b.map(x=>`<div class="bookingbox" style="padding:13px;border:1px solid var(--line);border-radius:12px;margin:8px 0"><b>${x.id} · ${x.location} · 🅿️ P-${String(x.parkingNo).padStart(2,'0')}</b><div class="sub">${x.date} · ${x.time} · ${x.duration} hr · ₹${x.total} · <strong>${x.status}</strong></div><div style="display:flex;gap:7px;margin-top:9px"><button class="btn primary" onclick="navigateBooking('${x.id}')">🧭 Navigate</button>${(x.status==='Confirmed')?`<button class="btn" onclick="cancelUserBooking('${x.id}')">Cancel</button>`:''}</div></div>`).join(''):'<div class="bookingbox"><b>No bookings yet.</b><div class="sub">Your confirmed, completed and cancelled reservations will appear here.</div></div>'}<button class="btn primary" style="width:100%;margin-top:10px" onclick="this.closest('.modal').remove()">Close</button></div></div>`)}catch(e){toast('Unable to load booking history')}}
async function showHistory(){return loadBookings()}
async function navigateBooking(id){try{let b=(await api('/api/bookings')).find(x=>x.id===id);if(!b)return toast('Booking not found');let p=parking.find(x=>x.name===b.location);if(!p)return toast('Parking location not found');window.open('https://www.google.com/maps/dir/?api=1&destination='+mapsDestination(p),'_blank');toast('Navigation opened ✓')}catch(e){toast('Navigation failed')}}
async function cancelUserBooking(id){try{await api('/api/bookings/'+encodeURIComponent(id),{method:'DELETE'});toast('Booking cancelled and slot released ✓');await load();await loadBookings()}catch(e){toast(e.message||'Unable to cancel booking')}}
function showSettings(){let alerts=localStorage.getItem('parknova_alerts')!=='off',gps=localStorage.getItem('parknova_gps')!=='off',plate=localStorage.getItem('parknova_plate')||'GJ-03-AB-1234',theme=localStorage.getItem('parknova_theme')||'glass';document.body.insertAdjacentHTML('beforeend',`<div class="modal"><div class="box" style="width:min(560px,calc(100% - 30px))"><div class="ey">ParkNova · Account Settings</div><h2>Settings</h2><div class="bookingbox"><b>🔔 Parking alerts</b><div class="sub">Enable availability and booking notifications.</div><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input id="setAlerts" type="checkbox" ${alerts?'checked':''}> Enabled</label></div><div class="bookingbox"><b>📍 GPS location</b><div class="sub">Used when you request your current location.</div><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input id="setGps" type="checkbox" ${gps?'checked':''}> Enabled</label></div><div class="bookingbox"><b>🚗 Vehicle number</b><div class="sub">Saved with your browser for your parking pass.</div><input id="setPlate" value="${plate.replace(/"/g,'&quot;')}" style="width:100%;margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text)"></div><div class="bookingbox"><b>🎨 Theme</b><div class="sub">Choose your preferred interface theme.</div><select id="setTheme" style="width:100%;margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text)"><option value="glass" ${theme==='glass'?'selected':''}>Liquid Glass</option><option value="dark" ${theme==='dark'?'selected':''}>Midnight</option><option value="light" ${theme==='light'?'selected':''}>Light</option></select></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="saveSettings()">Save Settings</button><button class="btn" style="width:100%;margin-top:8px" onclick="this.closest('.modal').remove()">Cancel</button></div></div>`)}
function saveSettings(){localStorage.setItem('parknova_alerts',$('setAlerts').checked?'on':'off');localStorage.setItem('parknova_gps',$('setGps').checked?'on':'off');localStorage.setItem('parknova_plate',$('setPlate').value.trim()||'GJ-03-AB-1234');localStorage.setItem('parknova_theme',$('setTheme').value);applySettings();document.querySelector('.modal')?.remove();toast('Settings saved ✓')}
function applySettings(){let t=localStorage.getItem('parknova_theme')||'glass';document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t==='light'?'light':'dark'}
async function admin(){if(me?.role!=='admin')return;let d=await api('/api/admin/dashboard');let bookings=await api('/api/bookings');let rows=parking.map(x=>`<div class="bookingbox" style="margin:8px 0"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${x.name}</b><div class="sub">${x.area} · ₹${x.price}/hr · ${x.free}/${x.total} free</div></div><span class="tag ${x.free?'free':'busy'}">${x.free?'AVAILABLE':'FULL'}</span></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px"><button class="btn" onclick="adminAdjust(${x.id},-1)">− Occupy</button><button class="btn" onclick="adminAdjust(${x.id},1)">＋ Free</button><button class="btn" onclick="adminEdit(${x.id})">Edit</button><button class="btn" onclick="adminDelete(${x.id})">Remove</button><button class="btn primary" onclick="adminReserve(${x.id})">Reserve Booking</button></div></div>`).join('');let history=bookings.length?bookings.map(x=>`<div class="bookingbox" style="margin:8px 0"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><b>${x.id} · ${x.location} · 🅿️ P-${String(x.parkingNo).padStart(2,'0')}</b><div class="sub">${x.user} · ${x.date} ${x.time} · ${x.duration} hr · ₹${x.total}</div></div><span class="tag ${x.status==='Cancelled'?'busy':'free'}">${x.status}</span></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${(x.status==='Confirmed'||x.status==='Reserved')?`<button class="btn" onclick="adminBookingStatus('${x.id}','Completed')">✓ Complete</button><button class="btn" onclick="adminBookingStatus('${x.id}','Cancelled')">✕ Cancel</button>`:''}</div></div>`).join(''):'<div class="bookingbox">No reservations yet.</div>';document.body.insertAdjacentHTML('beforeend',`<div class="modal"><div class="box" style="width:min(1000px,calc(100% - 30px));max-height:92vh;overflow:auto"><div class="ey">Admin Console · Manual Operations</div><h2>Parking command center</h2><div class="adminGrid"><div class="stat"><div class="num">${d.freeSlots}</div><div class="label">Free slots</div></div><div class="stat"><div class="num">${d.occupied}</div><div class="label">Occupied now</div></div><div class="stat"><div class="num">${d.reservations}</div><div class="label">Reservations</div></div><div class="stat"><div class="num">₹${d.revenue}</div><div class="label">Revenue</div></div><div class="stat"><div class="num">${d.locations}</div><div class="label">Locations</div></div><div class="stat"><div class="num">RESERVE</div><div class="label">Admin booking</div></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px"><div><b>Manual parking control</b><div class="sub">Admin directly marks slots free/occupied.</div></div><button class="btn primary" onclick="adminAdd()">＋ Add Parking</button></div>${rows}<div style="margin-top:20px"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>Booking history & reservations</b><div class="sub">Reserve for a customer, confirm, complete or cancel.</div></div><button class="btn primary" onclick="adminReserve()">＋ New Reservation</button></div><div style="margin-top:8px">${history}</div></div><div style="margin-top:14px;display:flex;gap:8px"><button class="btn primary" onclick="this.closest('.modal').remove()">← Back to User Panel</button><button class="btn" onclick="this.closest('.modal').remove()">Close</button></div></div></div>`)}
async function adminAdjust(id,delta){let p=parking.find(x=>x.id===id);if(!p)return;let r=await api('/api/admin/parking/'+id,{method:'PUT',body:JSON.stringify({free:Math.max(0,Math.min(p.total,p.free+delta))})});if(r.id){document.querySelector('.modal').remove();await load();toast('Manual slot status updated ✓');admin()}}
async function adminEdit(id){let p=parking.find(x=>x.id===id);if(!p)return;let price=Number(prompt('Hourly price',p.price));let total=Number(prompt('Total slots',p.total));let name=prompt('Parking name',p.name);let area=prompt('Area / address',p.area);if(!Number.isFinite(price)||!Number.isInteger(total)||total<1)return toast('Invalid details');await api('/api/admin/parking/'+id,{method:'PUT',body:JSON.stringify({price,total,name,area})});document.querySelector('.modal').remove();await load();toast('Parking updated ✓');admin()}
async function adminDelete(id){if(!confirm('Remove this parking location?'))return;await api('/api/admin/parking/'+id,{method:'DELETE'});document.querySelector('.modal').remove();await load();toast('Parking removed ✓');admin()}
async function adminAdd(){let name=prompt('Parking name');if(!name)return;let area=prompt('Area / address','Rajkot');let total=Number(prompt('Total slots','20'));let price=Number(prompt('Price per hour','20'));let lat=Number(prompt('Latitude','22.3039'));let lng=Number(prompt('Longitude','70.8022'));if(!Number.isInteger(total)||total<1||!Number.isFinite(price)||!Number.isFinite(lat)||!Number.isFinite(lng))return toast('Invalid details');await api('/api/admin/parking',{method:'POST',body:JSON.stringify({name,area,price,total,lat,lng})});document.querySelector('.modal').remove();await load();toast('New parking added ✓');admin()}
async function adminReserve(id){let p=id?parking.find(x=>x.id===id):parking.find(x=>x.free>0);if(!p)return toast('No parking with free slot');let customer=prompt('Customer name / email');if(!customer)return;let date=prompt('Date (YYYY-MM-DD)',new Date().toISOString().slice(0,10));if(!date)return;let timeInput=prompt('Exact time (e.g. 8:37 AM or 8:37 PM)','8:37 PM');if(!timeInput)return;let tm=timeInput.trim().match(/^(1[0-2]|[1-9]):([0-5][0-9])\s*(AM|PM)$/i);if(!tm)return toast('Time must be like 8:37 AM or 8:37 PM');let th=Number(tm[1]),tmn=Number(tm[2]),ta=tm[3].toUpperCase();if(ta==='AM'){if(th===12)th=0}else if(th!==12)th+=12;let time=`${String(th).padStart(2,'0')}:${String(tmn).padStart(2,'0')}`;let duration=Number(prompt('Duration in hours','1'));if(!Number.isInteger(duration)||duration<1||duration>24)return toast('Duration must be between 1 and 24 hours');try{await api('/api/admin/bookings',{method:'POST',body:JSON.stringify({parkingId:p.id,customer,date,time,duration})});document.querySelector('.modal').remove();await load();toast('Reservation created ✓');admin()}catch(e){toast(e.message||'Reservation failed')}}
async function adminBookingStatus(id,status){try{await api('/api/admin/bookings/'+id,{method:'PUT',body:JSON.stringify({status})});document.querySelector('.modal').remove();await load();toast('Booking status: '+status+' ✓');admin()}catch(e){toast('Booking update failed')}}
function logout(){me=null;$('app').innerHTML='';login()}
applySettings();load().catch(() =>{document.body.innerHTML='<div style="padding:40px;font-family:Arial;color:white;background:#0b1020;min-height:100vh"><h1>ParkNova</h1><p>Please start the application and refresh this page.</p></div>'});

// Liquid Glass interaction system: springy buttons, glass ripple, spotlight, modal blur and animated close.
(function(){
  function closeGlassModal(modal){
    if(!modal||modal.classList.contains('closing'))return;
    modal.classList.add('closing');
    setTimeout(()=>modal.remove(),320);
  }
  document.addEventListener('click',e=>{
    const b=e.target.closest('.btn,.nav button');
    if(b){
      const r=b.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
      const ripple=document.createElement('span');ripple.className='glass-ripple';ripple.style.left=x+'px';ripple.style.top=y+'px';b.appendChild(ripple);setTimeout(()=>ripple.remove(),700);
      b.animate([{transform:'scale(1)'},{transform:'scale(.965)'},{transform:'scale(1)'}],{duration:300,easing:'cubic-bezier(.16,1,.3,1)'});
    }
  },true);
  document.addEventListener('pointermove',e=>{
    const s=e.target.closest('.card,.box,.side');if(!s)return;
    const r=s.getBoundingClientRect();s.style.setProperty('--gx',(e.clientX-r.left)+'px');s.style.setProperty('--gy',(e.clientY-r.top)+'px');
  },{passive:true});
  document.addEventListener('click',e=>{
    const modal=e.target.closest('.modal');
    if(modal&&e.target===modal)closeGlassModal(modal);
  },true);
  const obs=new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{
    if(n.nodeType!==1)return;
    const mod=n.classList?.contains('modal')?n:n.querySelector?.('.modal');
    if(mod){
      requestAnimationFrame(()=>mod.classList.add('modal-ready'));
      mod.addEventListener('pointerdown',ev=>{if(ev.target===mod)closeGlassModal(mod)});
      const box=mod.querySelector('.box');
      if(box){
        const shine=document.createElement('span');shine.className='glass-shine';box.appendChild(shine);setTimeout(()=>shine.remove(),1000);
      }
    }
  })));
  obs.observe(document.body,{childList:true,subtree:true});
})();
</script></body></html>
